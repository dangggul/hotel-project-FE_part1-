<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>reservation-guide</title>
    <link rel="stylesheet" href="../css/reservation.css" />
  </head>
  <body>
    <site-header></site-header>
    <main>
      <!-- =========================
           1. 메인 이미지
      ========================== -->
      <section class="reservation-visual">
        <img
          src="../image/hetel/reservation/header img.png"
          alt="실시간 예약 메인 이미지"
        />

        <div class="reservation-visual-text">
          <h1>RESERVATION</h1>
          <p>실시간예약</p>
        </div>
      </section>
      <!-- =========================
            Room Select
         ========================= -->
      <section class="room-select">
        <h2 class="room-select-title">객실 선택</h2>

        <div class="room-list">
          <!-- STANDARD -->
          <a href="./reservation-standard.html" class="room-item">
            <img
              src="../image/hetel/reservation/standard-default.png"
              alt="스탠다드 객실"
            />

            <div class="room-item-content">
              <h3>STANDARD</h3>

              <span class="room-arrow">
                <span class="arrow-line"></span>
                <span class="arrow-head">›</span>
              </span>
            </div>
          </a>

          <!-- DELUXE -->
          <a href="./reservation-deluxe.html" class="room-item">
            <img
              src="../image/hetel/reservation/deluxe-default.png"
              alt="디럭스 객실"
            />

            <div class="room-item-content">
              <h3>DELUXE</h3>

              <span class="room-arrow">
                <span class="arrow-line"></span>
                <span class="arrow-head">›</span>
              </span>
            </div>
          </a>

          <!-- PREMIUM -->
          <a href="./reservation-premium.html" class="room-item">
            <img
              src="../image/hetel/reservation/premium-default.png"
              alt="프리미엄 객실"
            />

            <div class="room-item-content">
              <h3>PREMIUM</h3>

              <span class="room-arrow">
                <span class="arrow-line"></span>
                <span class="arrow-head">›</span>
              </span>
            </div>
          </a>

          <!-- SUITE -->
          <a href="./reservation-suite.html" class="room-item">
            <img
              src="../image/hetel/reservation/suite-default.png"
              alt="스위트 객실"
            />

            <div class="room-item-content">
              <h3>SUITE</h3>

              <span class="room-arrow">
                <span class="arrow-line"></span>
                <span class="arrow-head">›</span>
              </span>
            </div>
          </a>
        </div>
      </section>

      <!-- =========================
       Reservation Notice
         ========================= -->
      <section class="reservation-notice">
        <h2 class="reservation-notice-title">취소 및 환불 규정</h2>

        <div class="reservation-notice-content">
          <p>
            예약 취소 및 변경은 이용일 기준에 따라 수수료가 발생할 수 있습니다.
          </p>
          <p>예약 관련 자세한 사항은 호텔 예약 규정을 확인해 주세요.</p>
          <p>성수기 및 특정 기간에는 별도의 취소 규정이 적용될 수 있습니다.</p>
          <p>예약 변경 및 취소 문의는 고객센터를 이용해 주세요.</p>
        </div>
      </section>
    </main>

    <site-footer></site-footer>
    <to-top></to-top>
    <script src="../js/components.js"></script>
  </body>
</html>
